[project]
name = "commvault-mcp-desktop-extension"
version = "0.1.0"
description = "Claude Desktop extension wrapping Commvault's official MCP server"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.40.49",
    "fastmcp>=3.2.0",
    "keyring>=25.6.0",
    "pyfiglet>=1.0.2",
    "python-dotenv>=1.1.0",
    "requests>=2.33.0",
    "rich>=14.0.0",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
    "authlib>=1.6.12",
]

[tool.uv]
constraint-dependencies = [
    "cryptography>=48.0.1",
    "idna>=3.15",
    "jaraco-context>=6.1.0",
    "Pygments>=2.20.0",
    "PyJWT>=2.13.0",
    "python-multipart>=0.0.31",
]
